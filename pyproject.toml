[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "counterstrike-lite"
version = "0.1.0"
description = "Counterstrike Lite: a five-agent fleet that triages new CVEs against an asset inventory (assessment sample solution)"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2,<2",
  "pydantic>=2.9,<3",
  "packaging>=24",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "cryptography>=43,<46",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8"]

[project.scripts]
counterstrike = "counterstrike.cli:main"
counterstrike-api = "counterstrike.server:main"
counterstrike-worker = "counterstrike.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
