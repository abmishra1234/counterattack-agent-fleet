# Counterstrike Lite - CI
# lint -> unit + contract tests (3.10 and 3.12) -> agent-fleet eval gate -> optional live-LLM smoke
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llm_smoke:
        description: "Also run the fleet against the real LLM gateway"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Enterprise runners: set repository variable PIP_INDEX_URL to the internal PyPI proxy.
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://pypi.org/simple' }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.8"
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit, guard and contract tests (offline, fake LLM)
        run: pytest --cov=counterstrike --cov-report=term-missing --cov-fail-under=80

  eval-gate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run the agent fleet
        run: python -m counterstrike run --data data --out out --llm fake
      - name: Release gate (precision, recall, priority, safety)
        run: >
          python -m counterstrike eval --out out --gold data/gold/expected_alerts.json
          --min-precision 1.0 --min-recall 1.0 --min-priority-accuracy 1.0
      - name: Upload outbox and scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: counterstrike-outbox
          path: out/
          retention-days: 14

  llm-smoke:
    # Manual only: costs tokens and needs gateway credentials stored as repo secrets.
    if: github.event_name == 'workflow_dispatch' && inputs.llm_smoke
    needs: eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m counterstrike run --data data --out out-llm --llm gateway
      - name: Gate (recall may dip with a live model; safety checks stay strict)
        run: >
          python -m counterstrike eval --out out-llm --gold data/gold/expected_alerts.json
          --min-precision 1.0 --min-recall 0.8 --min-priority-accuracy 1.0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: counterstrike-outbox-llm
          path: out-llm/
